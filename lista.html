<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atletas Confirmados | Mini-Voleibol</title>
    <style>
        :root {
            --black: #0a0a0a;
            --dark-gray: #1f2937;
            --mid-gray: #4b5563;
            --light-gray: #9ca3af;
            --bg: #f4f4f5;
            --card: #ffffff;
            --text: #111827;
            --border: #d4d4d8;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --other-esc-bg: #fffbeb;
            --other-esc-border: #f59e0b;
            --other-esc-text: #92400e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }

        header {
            background: var(--black); color: white; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            border-bottom: 3px solid var(--dark-gray);
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img {
            height: 50px; width: 50px; object-fit: contain; background: white;
            border-radius: 10px; padding: 4px; flex-shrink: 0;
        }
        .brand h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.3px; }
        .brand span { font-size: 0.84rem; color: var(--light-gray); display: block; }

        .btn-voltar-pais {
            color: var(--black); background: white; text-decoration: none; font-size: 0.85rem;
            padding: 9px 14px; border-radius: 8px; transition: 0.2s; font-weight: 700; border: 1px solid white;
            text-align: center;
        }
        .btn-voltar-pais:hover { background: #e4e4e7; border-color: #e4e4e7; }

        .container { max-width: 820px; margin: 20px auto; padding: 0 16px; }

        .filter-card {
            background: var(--card); border-radius: 14px; padding: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .filter-grid { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }

        .filter-footer {
            margin-top: 12px; padding-top: 10px; border-top: 1px solid #f4f4f5;
            display: flex; justify-content: flex-end;
        }
        .checkbox-inline {
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem;
            color: var(--mid-gray); font-weight: 600; cursor: pointer; user-select: none;
        }
        .checkbox-inline input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: var(--black); cursor: pointer;
        }

        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--dark-gray); text-transform: uppercase; }
        select {
            width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 16px; background: #fff; color: var(--text);
        }
        select:focus { outline: none; border-color: var(--black); }

        .torneio-block {
            background: var(--card); border-radius: 14px; padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .tb-header {
            display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;
            padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
        }
        .tb-title-area h2 { font-size: 1.1rem; color: var(--black); margin-bottom: 4px; line-height: 1.3; }
        .tb-meta { font-size: 0.85rem; color: var(--mid-gray); }
        .tb-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .tb-btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

        .badge {
            padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 6px;
        }
        .badge-a { background: var(--black); color: white; }
        .badge-b { background: #e4e4e7; color: var(--black); border: 1px solid #a1a1aa; }
        .badge-realizado { background: #f4f4f5; color: #52525b; border: 1px solid #d4d4d8; margin-left: 4px; }

        .count-pill {
            background: var(--success-bg); color: #166534; font-weight: 700; font-size: 0.85rem;
            padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
        }

        .legenda-outro-esc {
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem;
            color: var(--other-esc-text); background: var(--other-esc-bg);
            border: 1px solid #fcd34d; padding: 5px 10px; border-radius: 8px;
            margin-bottom: 12px; font-weight: 600;
        }

        .atletas-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px;
        }
        .atleta-chip {
            display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px;
            background: #fafafa; border: 1px solid var(--border); border-radius: 10px;
            font-weight: 600; font-size: 0.92rem; color: var(--text);
        }
        .atleta-chip-left {
            display: flex; align-items: center; gap: 10px; min-width: 0;
        }
        .atleta-chip-left span.nome-atleta {
            overflow-wrap: break-word; word-break: break-word;
        }
        .atleta-num {
            background: var(--black); color: white; width: 24px; height: 24px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
        }

        /* Destaque para atleta de outro escalão convocado no torneio */
        .atleta-chip.outro-escalao {
            background: var(--other-esc-bg);
            border: 1.5px solid var(--other-esc-border);
            color: #78350f;
        }
        .atleta-chip.outro-escalao .atleta-num {
            background: #d97706;
            color: white;
        }
        .tag-outro-esc {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-copy {
            background: #fafafa; border: 1px solid var(--dark-gray); color: var(--black);
            padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: 0.2s; touch-action: manipulation;
        }
        .btn-copy:hover { background: var(--black); color: white; }

        .btn-print {
            background: var(--black); border: 1px solid var(--black); color: white;
            padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: 0.2s; touch-action: manipulation;
        }
        .btn-print:hover { background: var(--dark-gray); border-color: var(--dark-gray); }

        .empty-state {
            text-align: center; padding: 28px 16px; color: var(--mid-gray); font-size: 0.92rem;
            background: #fafafa; border-radius: 10px; border: 1px dashed var(--border);
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--black); color: white; padding: 10px 20px; border-radius: 999px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: none; z-index: 2000; font-size: 0.88rem; font-weight: 600;
            border: 1px solid var(--dark-gray);
        }

        /* ================= RESPONSIVIDADE MOBILE ================= */
        @media (max-width: 600px) {
            header { padding: 14px 16px; flex-direction: column; align-items: stretch; }
            .brand img { height: 44px; width: 44px; }
            .brand h1 { font-size: 1.06rem; }
            .btn-voltar-pais { width: 100%; }

            .container { margin: 14px auto; padding: 0 12px; }
            .filter-card { padding: 14px; }
            .filter-grid { grid-template-columns: 1fr; gap: 10px; }
            .filter-footer { justify-content: flex-start; }

            .torneio-block { padding: 16px 14px; }
            .tb-header { flex-direction: column; align-items: stretch; gap: 10px; }
            .tb-actions { align-items: stretch; width: 100%; }
            .count-pill { align-self: flex-start; }
            .tb-btn-row { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
            .tb-btn-row button { width: 100%; padding: 9px 10px; }

            .atletas-grid { grid-template-columns: 1fr; gap: 8px; }
            .atleta-chip { padding: 11px 12px; font-size: 0.94rem; }

            .toast { left: 16px; right: 16px; bottom: 16px; transform: none; text-align: center; border-radius: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="logo.png" alt="Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🏐</text></svg>'">
            <div>
                <h1>Atletas Confirmados</h1>
                <span>Lista Oficial de Participação • Mini-Voleibol</span>
            </div>
        </div>
        <a href="pais.html" class="btn-voltar-pais">✍️ Autorizar Presença</a>
    </header>

    <div class="container">
        <div class="filter-card">
            <div class="filter-grid">
                <div>
                    <label for="filtro-escalao">Escalão</label>
                    <select id="filtro-escalao" onchange="atualizarFiltroTorneios()">
                        <option value="TODOS">Todos os Escalões</option>
                        <option value="Minis A">Minis A</option>
                        <option value="Minis B">Minis B</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-torneio">Competição / Data</label>
                    <select id="filtro-torneio" onchange="renderizarListaPublica()">
                        <option value="TODOS_ATIVOS">Próximos Torneios Convocados</option>
                    </select>
                </div>
            </div>
            <div class="filter-footer">
                <label class="checkbox-inline" title="Exibir também campeonatos realizados há mais de 3 dias">
                    <input type="checkbox" id="mostrar-passados-lista" onchange="atualizarFiltroTorneios()">
                    Mostrar torneios passados (+3 dias)
                </label>
            </div>
        </div>

        <div id="conteudo-listas">
            <div class="empty-state">A carregar listas confirmadas...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHrazgKg6ezFPMyclQyc8keXXGV6QGG38",
            authDomain: "inscricoesminis.firebaseapp.com",
            projectId: "inscricoesminis",
            storageBucket: "inscricoesminis.firebasestorage.app",
            messagingSenderId: "1005618476458",
            appId: "1:1005618476458:web:0675310fae2bfd989ae7d3",
            measurementId: "G-6QYJ3MC92P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let atletas = [];
        let torneios = [];
        let inscricoes = [];

        function normalizarPolo(polo) {
            if (!polo) return "Não definido";
            if (polo === "Polo Gonçalo Nunes" || polo === "Polo Barcelos") return "Polo Barcelos";
            return polo;
        }

        function obterDataCorteTorneios() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() - 3);
            const ano = d.getFullYear();
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const dia = String(d.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        window.mostrarToast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2800);
        };

        onSnapshot(query(collection(db, "atletas"), orderBy("nome")), (snap) => {
            atletas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderizarListaPublica();
        });

        onSnapshot(query(collection(db, "torneios"), orderBy("data")), (snap) => {
            torneios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            atualizarFiltroTorneios();
        });

        onSnapshot(collection(db, "inscricoes"), (snap) => {
            inscricoes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            atualizarFiltroTorneios();
        });

        window.atualizarFiltroTorneios = () => {
            const esc = document.getElementById('filtro-escalao').value;
            const selTorneio = document.getElementById('filtro-torneio');
            const mostrarPassados = document.getElementById('mostrar-passados-lista')?.checked;
            const dataCorte = obterDataCorteTorneios();
            const selecionadoAnterior = selTorneio.value;

            const torneiosComInscricao = torneios.filter(t => {
                const matchEsc = esc === "TODOS" || (t.escalao || "").trim() === esc;
                const temConvocados = inscricoes.some(i => i.torneioId === t.id);
                const matchData = mostrarPassados || !t.data || t.data >= dataCorte;
                return matchEsc && temConvocados && matchData;
            });

            selTorneio.innerHTML = `<option value="TODOS_ATIVOS">Todos os Torneios Listados (${torneiosComInscricao.length})</option>` +
                torneiosComInscricao.map(t => {
                    const passadoTag = (t.data && t.data < dataCorte) ? ' (Realizado)' : '';
                    return `<option value="${t.id}">[${t.escalao}] ${formatarData(t.data)} - ${t.nome}${passadoTag}</option>`;
                }).join('');

            if (selecionadoAnterior && (selecionadoAnterior === "TODOS_ATIVOS" || torneiosComInscricao.some(t => t.id === selecionadoAnterior))) {
                selTorneio.value = selecionadoAnterior;
            }

            renderizarListaPublica();
        };

        window.renderizarListaPublica = () => {
            const esc = document.getElementById('filtro-escalao').value;
            const torneioFiltro = document.getElementById('filtro-torneio').value;
            const mostrarPassados = document.getElementById('mostrar-passados-lista')?.checked;
            const dataCorte = obterDataCorteTorneios();
            const container = document.getElementById('conteudo-listas');

            let torneiosExibir = torneios.filter(t => {
                const matchEsc = esc === "TODOS" || (t.escalao || "").trim() === esc;
                const temConvocados = inscricoes.some(i => i.torneioId === t.id);
                const matchData = mostrarPassados || !t.data || t.data >= dataCorte;
                const matchTorneio = torneioFiltro === "TODOS_ATIVOS" || t.id === torneioFiltro;
                return matchEsc && temConvocados && matchData && matchTorneio;
            });

            if (torneiosExibir.length === 0) {
                container.innerHTML = `<div class="empty-state">Ainda não existem convocatórias próximas abertas para este filtro.</div>`;
                return;
            }

            container.innerHTML = torneiosExibir.map(t => {
                const ehPassado = Boolean(t.data && t.data < dataCorte);
                const escTorneio = (t.escalao || "").trim();

                const idsAutorizados = inscricoes
                    .filter(i => i.torneioId === t.id && i.status === 'autorizado')
                    .map(i => i.atletaId);

                const atletasConfirmados = atletas
                    .filter(a => idsAutorizados.includes(a.id))
                    .sort((a, b) => a.nome.localeCompare(b.nome));

                const totalPendentes = inscricoes.filter(i => i.torneioId === t.id && i.status === 'pendente').length;
                const qtdOutroEscalao = atletasConfirmados.filter(a => (a.escalao || "").trim() !== escTorneio).length;
                const outroEscalaoNome = escTorneio === "Minis A" ? "Minis B" : "Minis A";

                return `
                    <div class="torneio-block">
                        <div class="tb-header">
                            <div class="tb-title-area">
                                <span class="badge ${escTorneio === 'Minis A' ? 'badge-a' : 'badge-b'}">${escTorneio}</span>
                                ${ehPassado ? `<span class="badge badge-realizado">Realizado</span>` : ''}
                                <h2>${t.nome}</h2>
                                <div class="tb-meta">
                                    📅 <strong>Data:</strong> ${formatarData(t.data)} &nbsp;•&nbsp; 📍 <strong>Local:</strong> ${t.pavilhao}
                                </div>
                            </div>
                            <div class="tb-actions">
                                <span class="count-pill">✅ ${atletasConfirmados.length} Confirmado${atletasConfirmados.length === 1 ? '' : 's'}</span>
                                ${atletasConfirmados.length > 0 ? `
                                    <div class="tb-btn-row">
                                        <button type="button" class="btn-copy" onclick="copiarListaWhatsApp('${t.id}')">📋 Copiar p/ WhatsApp</button>
                                        <button type="button" class="btn-print" onclick="imprimirListaTorneio('${t.id}')">🖨️ Imprimir / PDF</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        ${qtdOutroEscalao > 0 ? `
                            <div class="legenda-outro-esc">
                                🔶 Destaque a amarelo: ${qtdOutroEscalao} atleta(s) de <strong>${outroEscalaoNome}</strong> convocado(s) para este torneio
                            </div>
                        ` : ''}

                        ${atletasConfirmados.length === 0 ? `
                            <div class="empty-state">Ainda nenhum atleta confirmado para este torneio (${totalPendentes} a aguardar autorização).</div>
                        ` : `
                            <div class="atletas-grid">
                                ${atletasConfirmados.map((a, index) => {
                                    const escAtleta = (a.escalao || "").trim();
                                    const ehOutroEscalao = escAtleta && escAtleta !== escTorneio;
                                    return `
                                        <div class="atleta-chip ${ehOutroEscalao ? 'outro-escalao' : ''}">
                                            <div class="atleta-chip-left">
                                                <span class="atleta-num">${index + 1}</span>
                                                <span class="nome-atleta">${a.nome}</span>
                                            </div>
                                            ${ehOutroEscalao ? `<span class="tag-outro-esc">${escAtleta}</span>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        };

        window.copiarListaWhatsApp = (torneioId) => {
            const t = torneios.find(x => x.id === torneioId);
            if (!t) return;

            const escTorneio = (t.escalao || "").trim();
            const idsAutorizados = inscricoes
                .filter(i => i.torneioId === torneioId && i.status === 'autorizado')
                .map(i => i.atletaId);

            const atletasConfirmados = atletas
                .filter(a => idsAutorizados.includes(a.id))
                .sort((a, b) => a.nome.localeCompare(b.nome));

            let texto = `🏐 *${escTorneio} - ${t.nome}*\n`;
            texto += `📅 Data: ${formatarData(t.data)} | 📍 ${t.pavilhao}\n\n`;
            texto += `*Atletas Confirmados (${atletasConfirmados.length}):*\n`;
            atletasConfirmados.forEach((a, idx) => {
                const escAtleta = (a.escalao || "").trim();
                const tagExtra = (escAtleta && escAtleta !== escTorneio) ? ` (${escAtleta})` : '';
                texto += `${idx + 1}. ${a.nome}${tagExtra}\n`;
            });

            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast("📋 Lista copiada para o WhatsApp!");
            });
        };

        window.imprimirListaTorneio = (torneioId) => {
            const t = torneios.find(x => x.id === torneioId);
            if (!t) return;

            const escTorneio = (t.escalao || "").trim();
            const idsAutorizados = inscricoes
                .filter(i => i.torneioId === torneioId && i.status === 'autorizado')
                .map(i => i.atletaId);

            const atletasConfirmados = atletas
                .filter(a => idsAutorizados.includes(a.id))
                .sort((a, b) => a.nome.localeCompare(b.nome));

            if (atletasConfirmados.length === 0) {
                alert("Não há atletas confirmados neste torneio para imprimir.");
                return;
            }

            const totalConvocados = inscricoes.filter(i => i.torneioId === torneioId).length;
            const totalPendentes = inscricoes.filter(i => i.torneioId === torneioId && i.status === 'pendente').length;
            const totFem = atletasConfirmados.filter(a => a.genero === "Feminino").length;
            const totMasc = atletasConfirmados.filter(a => a.genero === "Masculino").length;

            const dataEmissao = new Date().toLocaleDateString('pt-PT', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            const logoUrl = new URL('logo.png', window.location.href).href;

            const linhasHtml = atletasConfirmados.map((a, idx) => {
                const escAtleta = (a.escalao || "").trim();
                const ehOutroEscalao = escAtleta && escAtleta !== escTorneio;
                return `
                    <tr class="${ehOutroEscalao ? 'row-outro-esc' : ''}">
                        <td style="text-align:center; color:${ehOutroEscalao ? '#b45309' : '#6b7280'}; font-weight:700;">${idx + 1}</td>
                        <td><strong>${a.nome}</strong></td>
                        <td>${a.genero || "—"}</td>
                        <td><span class="pill ${ehOutroEscalao ? 'pill-amber' : (escAtleta === 'Minis A' ? 'pill-dark' : 'pill-light')}">${escAtleta}</span></td>
                        <td>${normalizarPolo(a.polo)}</td>
                        <td>${formatarNascimento(a.nascimento)}</td>
                    </tr>
                `;
            }).join('');

            const janelaPrint = window.open('', '_blank', 'width=1024,height=800');
            if (!janelaPrint) {
                alert("Por favor, permita pop-ups no navegador para abrir a página de impressão/PDF.");
                return;
            }

            janelaPrint.document.write(`
                <!DOCTYPE html>
                <html lang="pt-PT">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Convocatória Confirmada — ${t.nome}</title>
                    <style>
                        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
                        body { background: #e5e7eb; color: #111827; padding: 16px; }
                        .toolbar {
                            max-width: 920px; margin: 0 auto 16px auto; background: #111827; color: white;
                            padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
                        }
                        .toolbar button {
                            background: white; color: #111827; border: none; padding: 9px 18px; border-radius: 8px;
                            font-weight: 700; cursor: pointer; font-size: 0.9rem;
                        }
                        .toolbar button:hover { background: #f3f4f6; }
                        .sheet {
                            max-width: 920px; margin: 0 auto; background: white; padding: 28px 32px;
                            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
                        }
                        .report-header {
                            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
                            border-bottom: 2px solid #111827; padding-bottom: 16px; margin-bottom: 18px;
                        }
                        .report-brand { display: flex; align-items: center; gap: 14px; }
                        .report-brand img { height: 52px; width: 52px; object-fit: contain; }
                        .report-brand h1 { font-size: 1.22rem; font-weight: 800; color: #0a0a0a; letter-spacing: -0.3px; }
                        .report-brand p { font-size: 0.85rem; color: #4b5563; margin-top: 2px; }
                        .report-meta { text-align: right; font-size: 0.8rem; color: #4b5563; }

                        .event-banner {
                            background: #f9fafb; border: 1px solid #d1d5db; border-left: 5px solid #111827;
                            border-radius: 8px; padding: 12px 16px; margin-bottom: 18px;
                            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 0.88rem;
                        }
                        .event-banner strong { color: #0a0a0a; }

                        .summary-grid {
                            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 22px;
                        }
                        @media (max-width: 700px) {
                            .sheet { padding: 18px 16px; }
                            .summary-grid { grid-template-columns: repeat(2, 1fr); }
                            .report-meta { text-align: left; }
                        }
                        .sum-card {
                            border: 1px solid #d1d5db; border-radius: 8px; padding: 9px 6px; text-align: center; background: #fafafa;
                        }
                        .sum-card.main { background: #111827; color: white; border-color: #111827; }
                        .sum-card.main span { color: #d1d5db; }
                        .sum-card strong { display: block; font-size: 1.15rem; line-height: 1.2; }
                        .sum-card span { font-size: 0.66rem; text-transform: uppercase; font-weight: 700; color: #4b5563; }
                        .table-scroll { overflow-x: auto; }
                        table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
                        th {
                            background: #111827; color: white; text-align: left; padding: 9px 8px;
                            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
                        }
                        td { padding: 9px 8px; border-bottom: 1px solid #e5e7eb; }
                        tr:nth-child(even) td { background: #f9fafb; }
                        tr.row-outro-esc td { background: #fffbeb !important; }
                        .pill {
                            padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; display: inline-block; white-space: nowrap;
                        }
                        .pill-dark { background: #111827; color: white; }
                        .pill-light { background: #e5e7eb; color: #111827; }
                        .pill-amber { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
                        .footer-note {
                            margin-top: 20px; padding-top: 12px; border-top: 1px solid #e5e7eb;
                            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.75rem; color: #6b7280;
                        }
                        @media print {
                            body { background: white; padding: 0; }
                            .toolbar { display: none !important; }
                            .sheet { box-shadow: none; padding: 0; max-width: 100%; border-radius: 0; }
                            .summary-grid { grid-template-columns: repeat(5, 1fr) !important; }
                            th, .event-banner { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            .sum-card.main, .pill-dark, .pill-light, .pill-amber, tr:nth-child(even) td, tr.row-outro-esc td {
                                -webkit-print-color-adjust: exact; print-color-adjust: exact;
                            }
                        }
                    </style>
                </head>
                <body>
                    <div class="toolbar">
                        <span>Pré-visualização — ${atletasConfirmados.length} atleta(s) confirmado(s)</span>
                        <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
                    </div>
                    <div class="sheet">
                        <div class="report-header">
                            <div class="report-brand">
                                <img src="${logoUrl}" onerror="this.style.display='none'">
                                <div>
                                    <h1>Atletas Confirmados — ${t.nome}</h1>
                                    <p>Escalão: ${t.escalao} • Lista Oficial de Participação</p>
                                </div>
                            </div>
                            <div class="report-meta">
                                <strong>Emitido em:</strong><br>${dataEmissao}
                            </div>
                        </div>

                        <div class="event-banner">
                            <div>📅 <strong>Data do Torneio:</strong> ${formatarData(t.data)}</div>
                            <div>📍 <strong>Local / Pavilhão:</strong> ${t.pavilhao}</div>
                            <div>🏐 <strong>Escalão:</strong> ${t.escalao}</div>
                        </div>

                        <div class="summary-grid">
                            <div class="sum-card main"><strong>${atletasConfirmados.length}</strong><span>Confirmados</span></div>
                            <div class="sum-card"><strong>${totFem}</strong><span>Feminino</span></div>
                            <div class="sum-card"><strong>${totMasc}</strong><span>Masculino</span></div>
                            <div class="sum-card"><strong>${totalPendentes}</strong><span>Pendentes</span></div>
                            <div class="sum-card"><strong>${totalConvocados}</strong><span>Convocados</span></div>
                        </div>

                        <div class="table-scroll">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:40px; text-align:center;">#</th>
                                        <th>Nome Completo</th>
                                        <th>Género</th>
                                        <th>Escalão</th>
                                        <th>Polo</th>
                                        <th>Nascimento</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${linhasHtml}
                                </tbody>
                            </table>
                        </div>

                        <div class="footer-note">
                            <span>Mini-Voleibol • Lista de Atletas Autorizados pelos Encarregados de Educação</span>
                            <span>Total confirmado: ${atletasConfirmados.length} atleta(s)</span>
                        </div>
                    </div>
                </body>
                </html>
            `);
            janelaPrint.document.close();
        };

        function formatarData(iso) {
            if (!iso) return "-";
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        }

        function formatarNascimento(val) {
            if (!val) return "-";
            const str = String(val);
            if (str.length === 4) return str;
            return formatarData(str);
        }
    </script>
</body>
</html>
